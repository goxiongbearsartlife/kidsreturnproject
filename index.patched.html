  <script>
  (function(){
    var dataTag = document.getElementById('program-data');
    try { var items = JSON.parse(dataTag.textContent); } catch(e) { console.error('JSON parse error', e); items = []; }
    var grid = document.getElementById('cardsGrid');
    if (!grid) return;

    grid.innerHTML = items.map(function(it){
      var media = it.media_mp4
        ? '<video class="card__video" src="' + it.media_mp4 + '" muted loop playsinline preload="metadata"' + (it.poster_img ? ' poster="' + it.poster_img + '"' : '') + '></video>'
        : '<img class="card__img" src="' + it.media_gif + '" alt="' + (it.alt || '') + '">';
      return (
        '<article class="card">' +
          '<div class="card__media">' + media + '</div>' +
          '<div class="card__copy">' +
            '<h3 class="card__title">' + (it.title || '') + '</h3>' +
            '<p class="card__meta">' + (it.city || '') + ', ' + (it.country || '') + '; ' + (it.year || '') + '; <span>' + (it.duration || '') + '</span></p>' +
          '</div>' +
        '</article>'
      );
    }).join('');

    var search = document.getElementById('cardsSearch');
    if (search) {
      search.addEventListener('input', function(e){
        var q = (e.target.value || '').toLowerCase().trim();
        Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(card){
          var t = (card.querySelector('.card__title') || {}).textContent || '';
          var m = (card.querySelector('.card__meta') || {}).textContent || '';
          card.style.display = (t + m).toLowerCase().indexOf(q) > -1 ? '' : 'none';
        });
      });
    }
  })();
  </script>
